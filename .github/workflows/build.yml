name: Build Module APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Module with Gradle
      run: |
        cd android
        # 强制使用旧版 Gradle 兼容模式，忽略废弃警告
        gradle wrapper --gradle-version 8.5
        chmod +x ./gradlew
        
        # 尝试编译
        ./gradlew assembleDebug --warning-mode all || true
        
        # 如果是 Library 模块，执行下面这行生成 AAR
        ./gradlew :app:assembleDebug || ./gradlew :lib:assembleDebug || ./gradlew assembleDebug --continue || true

    - name: Upload Build Outputs
      uses: actions/upload-artifact@v4
      with:
        name: Build-Artifacts
        path: |
          android/**/build/outputs/**/*.apk
          android/**/build/outputs/**/*.aar
