name: Explore Files

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: List files in root
      run: ls -la
      
    - name: Find gradlew location
      run: find . -name "gradlew"
